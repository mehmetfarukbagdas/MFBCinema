services:
  postgres:
    profiles: ["legacy-api"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mfbcinema
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
    ports: ["5432:5432"]
    volumes: ["cinema_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mfbcinema"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    profiles: ["legacy-api"]
    build: ./backend/MfbCinema.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Cinema: Host=postgres;Port=5432;Database=mfbcinema;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY (32+ random characters) in your local .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      Admin__Emails__0: ${ADMIN_EMAIL:-}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  cinema_data:
